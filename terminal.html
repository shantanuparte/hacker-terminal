<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Terminal</title>
    <link rel="stylesheet" href="terminal.css">
</head>
<body>

    <!-- id greet la user message yenar aahe -->
    <div class="body">

        <div class="top">
            <div>
                <h1>Night<span class="T">T</span>erminal</h1>
            </div>
            <div class="time">
                <p id = "time_p">time</p>
            </div>
        </div>
        
        <div class="main">

            <!-- option -->
            <div class="options">
                <div class="option_header">
                    <img src="img/icons8-terminal-90.png" alt="" class="terminal_img">
                    <span>NightTerminal</span>
                </div>

                <div class="option_list">
                    <div class="option">
                        <span>🧮</span>
                        <span>Calculator</span>
                    </div>

                    <div class="option">
                        <span>📁</span>
                        <span>Files</span>
                    </div>

                    <div class="option">
                        <span>🌐</span>
                        <span>About</span>
                    </div>
                </div>

            </div>

            <!-- Terminal -->
            <div class="terminal">
                <div id="greet">
                    
                </div>
                
            </div>

            <!-- Utils -->
            <div class="utils">
    
            </div>

        </div>

        <div class="bottom">
    
        </div>
    </div>

    <script src="terminal.js"></script>
</body>
</html>
